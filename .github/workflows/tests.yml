# Tes otomatis setiap push / pull request: seluruh tes (SQLite) + tes khas PostgreSQL.
name: Tes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crs_tes
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Seluruh tes (SQLite, luring)
        run: python -m pytest -q
      - name: Tes khas backend PostgreSQL
        env:
          CRS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crs_tes
        run: python -m pytest -q tests/test_db_postgres.py
